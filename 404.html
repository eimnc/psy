<style>
@font-face{font-family:'Literata';font-style:normal;font-weight:300;font-display:swap;src:url('/assets/fonts/literata-300.woff2') format('woff2')}
@font-face{font-family:'Literata';font-style:normal;font-weight:500;font-display:swap;src:url('/assets/fonts/literata-500-name.woff2') format('woff2')}

@font-face{font-family:'Onest';font-style:normal;font-weight:400;font-display:swap;src:url('/assets/fonts/onest-400.woff2') format('woff2')}
@font-face{font-family:'Onest';font-style:normal;font-weight:500;font-display:swap;src:url('/assets/fonts/onest-500.woff2') format('woff2')}

*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#f2f1ee;color:#1c1b19;font-family:'Onest',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1c1b19}
[data-cta]{transition:transform 90ms ease}
[data-cta]:active{transform:scale(0.978)}
@media (hover:hover) and (pointer:fine){
  [data-link]:hover{color:#1c1b19;border-bottom-color:rgba(28,27,25,0.55)}
}
:focus-visible{outline:2px solid #1c1b19;outline-offset:3px;border-radius:4px}

/* --- котик: позы через visibility, НЕ display (iOS Safari не перезапускает CSS-анимацию ног) --- */
[data-cat]{position:absolute;left:0;bottom:-4.4px;width:76px;height:47.5px;color:#6b6963;cursor:pointer;-webkit-tap-highlight-color:transparent;will-change:transform}
[data-cat] svg{display:block;width:100%;height:100%;overflow:visible}
[data-cat] g[data-g]{visibility:hidden}
[data-cat][data-pose="walk"] g[data-g="walk"]{visibility:visible}
[data-cat][data-pose="sit"] g[data-g="sit"]{visibility:visible}
[data-cat][data-pose="sleep"] g[data-g="sleep"]{visibility:visible}
[data-cat][data-pose="stretch"] g[data-g="stretch"]{visibility:visible}
[data-cat][data-pose="attent"] g[data-g="attent"]{visibility:visible}
[data-cat][data-pose="groom"] g[data-g="groom"]{visibility:visible}
[data-cat] .cat-leg{transform-box:fill-box;transform-origin:50% 4%;animation:catLeg 0.4s ease-in-out infinite alternate}
[data-cat] .cat-leg.l2{animation-delay:-0.4s}
@keyframes catLeg{from{transform:rotate(13deg)}to{transform:rotate(-13deg)}}
[data-cat] .cat-tail{transform-box:fill-box;transform-origin:100% 100%;animation:catTail 1.3s ease-in-out infinite alternate}
@keyframes catTail{from{transform:rotate(5deg)}to{transform:rotate(-6deg)}}
[data-cat] .cat-tail-sit{transform-box:fill-box;transform-origin:0% 60%;animation:catTailSit 3.4s ease-in-out infinite alternate}
@keyframes catTailSit{from{transform:rotate(0deg)}to{transform:rotate(-4deg)}}
[data-cat] .cat-tail-up{transform-box:fill-box;transform-origin:80% 100%;animation:catTailUp 1.6s ease-in-out infinite alternate}
@keyframes catTailUp{from{transform:rotate(4deg)}to{transform:rotate(-6deg)}}
[data-cat] .cat-groom-head{transform-box:fill-box;transform-origin:30% 95%;animation:catGroom 0.85s ease-in-out infinite alternate}
@keyframes catGroom{from{transform:rotate(-2deg)}to{transform:rotate(6deg)}}
[data-cat] .cat-groom-paw{transform-box:fill-box;transform-origin:15% 100%;animation:catPaw 0.85s ease-in-out infinite alternate}
@keyframes catPaw{from{transform:rotate(3deg)}to{transform:rotate(-3deg)}}
[data-cat] .cat-breath{transform-box:fill-box;transform-origin:50% 100%;animation:catBreath 2.7s ease-in-out infinite alternate}
@keyframes catBreath{from{transform:scale(1,1)}to{transform:scale(1.015,1.05)}}
[data-cat] .cat-z{stroke:none;fill:currentColor;font-family:'Literata',Georgia,serif;font-style:italic;animation:catZ 2.4s ease-in-out infinite}
[data-cat] .cat-z.z2{animation-delay:-1.2s}
@keyframes catZ{0%,100%{opacity:0}40%{opacity:0.9}}
[data-cat] .eye-h{display:none}
[data-cat] g[data-g="sit"] .eye-o{animation:catBlinkO 5.2s linear infinite}
[data-cat] g[data-g="sit"] .eye-h{display:block;opacity:0;animation:catBlinkH 5.2s linear infinite}
@keyframes catBlinkO{0%,90.5%,97%,100%{opacity:1}92.5%,95.5%{opacity:0}}
@keyframes catBlinkH{0%,90.5%,97%,100%{opacity:0}92.5%,95.5%{opacity:1}}
[data-cat].cat-pet g[data-g="sit"] .eye-o{display:none}
[data-cat].cat-pet g[data-g="sit"] .eye-h{display:block;opacity:1;animation:none}
[data-cat].cat-spin [data-cat-flip]{animation:catSpin 1.25s linear both}
@keyframes catSpin{from{transform:perspective(170px) rotateY(0deg)}to{transform:perspective(170px) rotateY(1440deg)}}
[data-cat-say]{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translate(-50%,5px);font-family:'Literata',Georgia,serif;font-style:italic;font-size:13px;color:#6b6963;opacity:0;transition:opacity 0.35s ease,transform 0.35s ease;white-space:nowrap;pointer-events:none}
[data-cat].cat-say [data-cat-say]{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  [data-cat] *{animation:none !important}
  [data-cta]{transition:none}
}
@media (max-width:560px){
  [data-cat]{width:60px;height:37.5px;bottom:-3.2px}
}

<script>
(function () {
  var el = document.querySelector('[data-cat]'), shelf = document.querySelector('[data-shelf]');
  if (!el || !shelf) return;
  var flip = el.querySelector('[data-cat-flip]'), say = el.querySelector('[data-cat-say]');
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var C = { x: 0, tx: 0, mode: 'idle', raf: 0, last: 0, timers: [], sayT: 0, attT: 0, petN: 0, petT: 0 };

  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var catW = function () { return el.offsetWidth || 76; };
  var maxX = function () { return Math.max(0, shelf.clientWidth - catW()); };
  var place = function () { el.style.transform = 'translateX(' + C.x.toFixed(1) + 'px)'; };
  var pose = function (p) { el.setAttribute('data-pose', p); };
  var face = function (d) { flip.style.transform = d < 0 ? 'scaleX(-1)' : 'none'; };
  var wait = function (ms, fn) { C.timers.push(setTimeout(fn, ms)); };
  var clearWaits = function () { C.timers.forEach(clearTimeout); C.timers = []; };
  var sayNow = function (t, ms) {
    say.textContent = t; el.classList.add('cat-say');
    clearTimeout(C.sayT);
    C.sayT = setTimeout(function () { el.classList.remove('cat-say'); }, ms || 1600);
  };

  var step = function (t) {
    if (C.mode !== 'walk') { C.last = 0; return; }
    var dt = C.last ? Math.min(48, t - C.last) : 16;
    C.last = t;
    var d = C.tx - C.x, mv = 34 * dt / 1000;
    if (Math.abs(d) <= mv) { C.x = C.tx; place(); C.mode = 'idle'; C.last = 0; arrive(); return; }
    C.x += d > 0 ? mv : -mv;
    place();
    C.raf = requestAnimationFrame(step);
  };

  var walkTo = function (tx) {
    C.tx = Math.max(0, Math.min(maxX(), tx));
    if (Math.abs(C.tx - C.x) < 8) { wait(rnd(900, 1800), idleAct); return; }
    face(C.tx > C.x ? 1 : -1);
    pose('walk');
    C.mode = 'walk';
    cancelAnimationFrame(C.raf);
    C.raf = requestAnimationFrame(step);
  };

  var arrive = function () { pose('sit'); wait(rnd(1100, 2400), idleAct); };

  var idleAct = function () {
    if (C.mode !== 'idle') return;
    var r = Math.random();
    if (r < 0.24) { pose('groom'); wait(rnd(2600, 4200), idleAct); return; }
    if (r < 0.38) { pose('attent'); wait(rnd(1500, 2500), function () { pose('sit'); wait(rnd(900, 1800), idleAct); }); return; }
    if (r < 0.48) { pose('sit'); wait(rnd(2800, 5400), idleAct); return; }
    if (r < 0.56) {
      pose('sleep');
      wait(rnd(5200, 9000), function () { pose('stretch'); wait(950, function () { pose('sit'); wait(rnd(800, 1600), idleAct); }); });
      return;
    }
    var m = maxX(), tx = rnd(0, m);
    if (Math.abs(tx - C.x) < m * 0.28) tx = C.x < m / 2 ? rnd(m * 0.6, m) : rnd(0, m * 0.4);
    walkTo(tx);
  };

  el.addEventListener('click', function () {
    clearWaits();
    cancelAnimationFrame(C.raf);
    C.mode = 'idle';
    C.last = 0;
    el.classList.remove('cat-spin'); // клик мид-спин «ловит» кота — вращение обрывается
    pose('sit');
    var now = Date.now();
    C.petN = now - C.petT < 7000 ? C.petN + 1 : 1;
    C.petT = now;
    if (C.petN >= 5 && !RM) {
      // мем «у-и-и-а»: пятое поглаживание подряд — вертится волчком
      C.petN = 0;
      C.mode = 'spin';
      el.classList.remove('cat-pet');
      void el.offsetWidth;
      el.classList.add('cat-spin');
      sayNow('у-и-и-а!', 1400);
      wait(1350, function () {
        el.classList.remove('cat-spin');
        C.mode = 'idle';
        wait(rnd(500, 1200), idleAct);
      });
      return;
    }
    el.classList.add('cat-pet');
    sayNow(['мур', 'мрр', 'мяу'][Math.floor(Math.random() * 3)]);
    if (RM) return;
    wait(1800, function () { el.classList.remove('cat-pet'); idleAct(); });
  });

  // курсор подошёл близко — котик оборачивается
  window.addEventListener('pointermove', function (e) {
    if (RM || C.mode !== 'idle' || el.classList.contains('cat-pet')) return;
    var now = Date.now();
    if (now - C.attT < 5000) return;
    var r = el.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.abs(dx) > 80 || Math.abs(dy) > 90) return;
    C.attT = now;
    clearWaits();
    face(dx < 0 ? -1 : 1);
    pose('attent');
    wait(rnd(1700, 2500), function () { pose('sit'); wait(rnd(800, 1600), idleAct); });
  }, { passive: true });

  window.addEventListener('resize', function () {
    var m = maxX();
    if (C.x > m) { C.x = m; place(); }
    if (C.tx > m) C.tx = m;
  });

  C.x = Math.round(maxX() * 0.5);
  place();
  pose('sit');
  if (!RM) wait(1200, idleAct);
})();
</script>

</body>
</html>
