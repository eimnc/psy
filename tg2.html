<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tg2</title>
<style>
  html,body{margin:0}
  body{background:#ffe600;font:14px/1.4 -apple-system,system-ui,sans-serif}
  .spacer{height:700px}
  .flow{position:relative;height:2200px;background:#0a7d2b;color:#fff;padding:20px}
  .flow p{margin:0 0 26px}
  /* A — прижат к экрану, ровно на высоту окна. Чёрная кромка = где кончается «экран» для fixed */
  .A{position:fixed;left:0;width:25%;top:0;height:100vh;background:rgba(255,0,0,.5);border-bottom:5px solid #000;z-index:200;pointer-events:none}
  /* B — прижат к экрану, но вдвое выше окна: рисует ли fixed НИЖЕ экрана */
  .B{position:fixed;left:25%;width:25%;top:0;height:200vh;background:rgba(0,60,255,.55);z-index:200;pointer-events:none}
  /* C — прижат к экрану целиком НИЖЕ его нижнего края */
  .C{position:fixed;left:50%;width:25%;bottom:-160px;height:160px;background:#ff00ff;z-index:300;pointer-events:none}
  /* D — липкий, то есть обычное содержимое страницы: висит на 160 ниже низа окна */
  .D{position:sticky;bottom:-160px;height:160px;width:25%;margin-left:75%;background:#00e5ff;z-index:5}
  .out{position:fixed;left:6px;top:100px;z-index:400;background:rgba(255,255,255,.95);color:#000;font:12px/1.4 ui-monospace,monospace;padding:8px;border-radius:6px;white-space:pre}
</style></head>
<body>
<div class="spacer"></div>
<div class="flow">
  <p>ЗЕЛЁНОЕ — обычное содержимое страницы (оно точно рисуется под панелью).</p>
  <p>Красное А — слой в размер окна, чёрная линия = его низ.</p>
  <p>Синее B — слой вдвое выше окна.</p>
  <p>Малиновое C — слой целиком ниже окна.</p>
  <p>Голубое D — липкий блок ниже окна.</p>
  <div class="D"></div>
</div>
<div class="A"></div><div class="B"></div><div class="C"></div>
<div class="out" id="o">…</div>
<script>
(function(){
  var o=document.getElementById('o'),A=document.querySelector('.A'),S={};
  function tr(k,v){var s=S[k]||(S[k]={a:v,b:v});if(v<s.a)s.a=v;if(v>s.b)s.b=v;
    return (Math.round(s.a)===Math.round(s.b)?Math.round(v):Math.round(s.a)+'…'+Math.round(s.b))+' ['+Math.round(v)+']';}
  function t(){
    var vv=window.visualViewport,r=A.getBoundingClientRect();
    o.textContent='innerH '+tr('ih',window.innerHeight)+'\nvvH    '+(vv?tr('vh',vv.height):'—')
      +'\nvvTop  '+(vv?tr('vt',vv.offsetTop):'—')+'\nA низ  '+tr('ab',r.bottom);
    requestAnimationFrame(t);
  }
  t();
})();
</script>
</body></html>
