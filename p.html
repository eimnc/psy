<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Замер фона параллакса</title>
<style>
  html,body{margin:0;background:#2e261f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  #bg{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100lvh;z-index:0;background:center/cover no-repeat url("assets/bg-session.jpg");pointer-events:none}
  #sh{position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(16,14,12,.55),rgba(16,14,12,.64));pointer-events:none}
  #wrap{position:relative;z-index:2}
  .pad{height:120vh;display:flex;align-items:center;justify-content:center;font-size:15px;color:#d8d4cc;text-align:center;padding:0 24px}
  #panel{position:fixed;left:8px;right:8px;bottom:60px;z-index:50;background:rgba(255,255,255,.95);color:#111;border-radius:10px;padding:10px 12px;font:12px/1.4 ui-monospace,monospace;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  td{padding:2px 0}
  td:first-child{color:#555}
  td:last-child{text-align:right;font-weight:700}
  b.t{display:block;margin-bottom:6px;font:700 12px/1.2 -apple-system,sans-serif}
</style>
</head>
<body>
<div id="bg"></div>
<div id="wrap">
  <div id="sh" style="position:fixed"></div>
  <div class="pad">Пролистайте вниз, потом ВВЕРХ — так, чтобы выехало нижнее меню Telegram. Панель запоминает минимум и максимум.</div>
  <div class="pad">Ещё немного вниз…</div>
  <div class="pad">…и теперь наверх.</div>
</div>

<div id="panel">
  <b class="t">ЗАМЕР ФОНА · мин ⟷ макс за сессию</b>
  <table>
    <tr><td>высота слоя (box)</td><td id="bh">—</td></tr>
    <tr><td>верх слоя (rect.top)</td><td id="bt">—</td></tr>
    <tr><td>масштаб картинки</td><td id="sc">—</td></tr>
    <tr><td>innerHeight</td><td id="ih">—</td></tr>
    <tr><td>visualViewport.height</td><td id="vh">—</td></tr>
    <tr><td>vv.offsetTop</td><td id="vo">—</td></tr>
  </table>
</div>

<script>
(function(){
  var bg = document.getElementById('bg'), img = new Image(), nat = null;
  img.onload = function(){ nat = { w: img.naturalWidth, h: img.naturalHeight }; };
  img.src = 'assets/bg-session.jpg';
  var S = {};
  function track(k, v){
    if (!isFinite(v)) return '—';
    var s = S[k] || (S[k] = { min: v, max: v });
    if (v < s.min) s.min = v;
    if (v > s.max) s.max = v;
    var r = function(n){ return Math.round(n * 10) / 10; };
    return s.min === s.max ? r(v) + '' : r(s.min) + ' ⟷ ' + r(s.max) + '  (сейчас ' + r(v) + ')';
  }
  function tick(){
    var r = bg.getBoundingClientRect(), v = window.visualViewport;
    document.getElementById('bh').textContent = track('bh', r.height);
    document.getElementById('bt').textContent = track('bt', r.top);
    document.getElementById('sc').textContent = nat ? track('sc', Math.max(r.width / nat.w, r.height / nat.h) * 100) + ' %' : '…';
    document.getElementById('ih').textContent = track('ih', window.innerHeight);
    document.getElementById('vh').textContent = v ? track('vh', v.height) : 'нет';
    document.getElementById('vo').textContent = v ? track('vo', v.offsetTop) : 'нет';
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
